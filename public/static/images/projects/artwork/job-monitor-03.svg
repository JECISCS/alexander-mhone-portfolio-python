tified when a match appears.</text><text x="265" y="151" fill="#76869A" font-family="Arial, sans-serif" font-size="11" font-weight="400" >Concept visuals based on the CV project description · Sample listings only</text><rect x="0" y="706" width="1440" height="54" rx="0" fill="#FFFFFF" /><text x="72" y="739" fill="#8795A5" font-family="Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1">WEBSITE MONITORING  ·  VACANCY FILTERING  ·  NOTIFICATIONS</text><text x="1368" y="739" fill="#8795A5" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="end" letter-spacing="1">ICT VACANCY MONITOR  /  03</text><rect x="265" y="181" width="695" height="484" rx="12" fill="#FFFFFF" stroke="#E5EAF0" stroke-width="1"/><text x="285" y="209" fill="#7C8BA0" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">NOTIFICATION PREVIEW  /  SAMPLE</text><rect x="292" y="239" width="640" height="365" rx="12" fill="#F7F9FB" /><rect x="292" y="239" width="640" height="62" rx="12" fill="#E8EEF5" /><text x="318" y="276" fill="#4C729A" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">NEW ICT VACANCY MATCH</text><rect x="318" y="325" width="586" height="100" rx="10" fill="#FFFFFF" stroke="#E5EAF0" stroke-width="1"/><text x="341" y="357" fill="#364B65" font-family="Arial, sans-serif" font-size="15" font-weight="700" >Sample ICT vacancy</text><text x="341" y="383" fill="#8290A0" font-family="Arial, sans-serif" font-size="10" font-weight="400" >Matched from a monitored Malawi job website</text><text x="341" y="407" fill="#9AA5B2" font-family="Arial, sans-serif" font-size="9" font-weight="400" >Example listing — not a current vacancy</text><rect x="318" y="448" width="586" height="1" rx="0" fill="#E4EAF0" /><text x="318" y="480" fill="#52647A" font-family="Arial, sans-serif" font-size="11" font-weight="400" >The monitor can send a notification when a relevant</text><text x="318" y="502" fill="#52647A"