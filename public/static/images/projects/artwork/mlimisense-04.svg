<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img"><title>Illustrative project interface artwork</title><desc>Original vector artwork representing a project interface. This is not a product screenshot.</desc><rect x="0" y="0" width="1440" height="760" rx="0" fill="#F2F5EF" /><rect x="0" y="0" width="228" height="760" rx="0" fill="#214B39" /><text x="31" y="47" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">MLIMI</text><text x="31" y="69" fill="#B8D7B3" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2">SENSE  /  AI</text><rect x="28" y="94" width="172" height="1" rx="0" fill="#3A654D" /><text x="42" y="143" fill="#BCD0C0" font-family="Arial, sans-serif" font-size="13" font-weight="400" >My farm</text><text x="42" y="191" fill="#BCD0C0" font-family="Arial, sans-serif" font-size="13" font-weight="400" >Check a crop</text><text x="42" y="239" fill="#BCD0C0" font-family="Arial, sans-serif" font-size="13" font-weight="400" >Local advice</text><rect x="13" y="262" width="201" height="38" rx="8" fill="#35644A" /><rect x="13" y="262" width="3" height="38" rx="2" fill="#C2DD83" /><text x="42" y="287" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="400" >Field notes</text><rect x="22" y="659" width="184" height="75" rx="10" fill="#2B5740" /><text x="38" y="685" fill="#D5E4B9" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">WORKS OFFLINE</text><text x="38" y="706" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="400" >Sync when connected</text><rect x="228" y="0" width="1212" height="74" rx="0" fill="#FFFFFF" /><text x="263" y="32" fill="#617267" font-family="Arial, sans-serif" font-size="12" font-weight="600" >MlimiSense  /  Farm workspace</text><text x="263" y="53" fill="#96A197" font-family="Arial, sans-serif" font-size="9" font-weight="600" letter-spacing=".8">DEMO EXPERIENCE  ·  SAMPLE FARM INFORMATION</text><rect x="1200" y="18" width="174" height="38" rx="18" fill="#EEF4EA" /><text x="1287" y="42" fill="#285D45" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">CHICHEWA  /  EN</text><text x="265" y="120" fill="#253B30" font-family="Arial, sans-serif" font-size="28" font-weight="700" >Bring farmers and experts together.</text><text x="265" y="147" fill="#748276" font-family="Arial, sans-serif" font-size="12" font-weight="400" >Keep field notes and prepare a question for an extension officer.</text><rect x="0" y="706" width="1440" height="54" rx="0" fill="#FFFFFF" /><text x="70" y="739" fill="#819083" font-family="Arial, sans-serif" font-size="9" font-weight="600" letter-spacing=".6">AI-ASSISTED CROP CHECKS  ·  LOCAL GUIDANCE  ·  HUMAN REVIEW</text><text x="1368" y="739" fill="#819083" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="end" letter-spacing="1">MLIMISENSE  /  04</text><rect x="265" y="177" width="703" height="478" rx="12" fill="#FFFFFF" stroke="#E3EAE1" stroke-width="1"/><text x="283" y="203" fill="#748276" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing=".7">FIELD JOURNAL  /  DEMO ENTRIES</text><text x="288" y="233" fill="#253B30" font-family="Arial, sans-serif" font-size="19" font-weight="700" >Keep useful details together.</text><text x="288" y="259" fill="#748276" font-family="Arial, sans-serif" font-size="10" font-weight="400" >A simple record helps farmers and experts discuss what changed.</text><rect x="288" y="286" width="656" height="1" rx="0" fill="#E3EAE1" /><rect x="290" y="320" width="69" height="48" rx="10" fill="#EAF2E5" /><text x="324" y="348" fill="#285D45" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">MON 12</text><text x="381" y="336" fill="#253B30" font-family="Arial, sans-serif" font-size="13" font-weight="600" >Field walk</text><text x="381" y="359" fill="#748276" font-family="Arial, sans-serif" font-size="10" font-weight="400" >Checked five plants in the east plot.</text><rect x="381" y="379" width="563" height="1" rx="0" fill="#E3EAE1" /><rect x="290" y="412" width="69" height="48" rx="10" fill="#EEF2F4" /><text x="324" y="440" fill="#285D45" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">FRI 09</text><text x="381" y="428" fill="#253B30" font-family="Arial, sans-serif" font-size="13" font-weight="600" >Rain observed</text><text x="381" y="451" fill="#748276" font-family="Arial, sans-serif" font-size="10" font-weight="400" >Light rainfall after three dry days.</text><rect x="381" y="471" width="563" height="1" rx="0" fill="#E3EAE1" /><rect x="290" y="504" width="69" height="48" rx="10" fill="#F4EFE2" /><text x="324" y="532" fill="#285D45" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">TUE 06</text><text x="381" y="520" fill="#253B30" font-family="Arial, sans-serif" font-size="13" font-weight="600" >Photo saved</text><text x="381" y="543" fill="#748276" font-family="Arial, sans-serif" font-size="10" font-weight="400" >Leaf photo added for expert review.</text><rect x="381" y="563" width="563" height="1" rx="0" fill="#E3EAE1" /><rect x="986" y="177" width="382" height="478" rx="12" fill="#FFFFFF" stroke="#E3EAE1" stroke-width="1"/><text x="1004" y="203" fill="#748276" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing=".7">PREPARE FOR AN EXPERT</text><rect x="1007" y="224" width="340" height="117" rx="12" fill="#EDF3E9" /><text x="1026" y="255" fill="#285D45" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">FIELD SUMMARY</text><text x="1026" y="284" fill="#253B30" font-family="Arial, sans-serif" font-size="10" font-weight="600" >Crop: maize  ·  Stage: early growth</text><text x="1026" y="307" fill="#748276" font-family="Arial, sans-serif" font-size="9" font-weight="400" >3 notes saved  ·  1 photo to review</text><text x="1007" y="382" fill="#748276" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">QUESTIONS TO DISCUSS</text><rect x="1007" y="399" width="340" height="57" rx="9" fill="#FFFFFF" stroke="#E3EAE1" stroke-width="1"/><text x="1024" y="423" fill="#253B30" font-family="Arial, sans-serif" font-size="10" font-weight="600" >What should I check next in this field?</text><text x="1024" y="442" fill="#748276" font-family="Arial, sans-serif" font-size="8" font-weight="400" >Edit before sharing</text><rect x="1007" y="479" width="340" height="46" rx="22" fill="#2C6447" /><text x="1177" y="508" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Prepare a question  →</text><text x="1007" y="557" fill="#253B30" font-family="Arial, sans-serif" font-size="10" font-weight="600" >Connect with a local extension officer.</text><text x="1007" y="579" fill="#748276" font-family="Arial, sans-serif" font-size="9" font-weight="400" >AI can help organize notes; people guide decisions.</text><text x="1007" y="623" fill="#285D45" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing=".4">FARMER-CONTROLLED  ·  HUMAN-IN-THE-LOOP</text></svg>