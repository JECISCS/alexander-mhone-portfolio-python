<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img"><title>Illustrative project interface artwork</title><desc>Original vector artwork representing a project interface. This is not a product screenshot.</desc><rect x="0" y="0" width="1440" height="760" rx="0" fill="#F2F5EF" /><rect x="0" y="0" width="228" height="760" rx="0" fill="#214B39" /><text x="31" y="47" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">MLIMI</text><text x="31" y="69" fill="#B8D7B3" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2">SENSE  /  AI</text><rect x="28" y="94" width="172" height="1" rx="0" fill="#3A654D" /><text x="42" y="143" fill="#BCD0C0" font-family="Arial, sans-serif" font-size="13" font-weight="400" >My farm</text><rect x="13" y="166" width="201" height="38" rx="8" fill="#35644A" /><rect x="13" y="166" width="3" height="38" rx="2" fill="#C2DD83" /><text x="42" y="191" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="400" >Check a crop</text><text x="42" y="239" fill="#BCD0C0" font-family="Arial, sans-serif" font-size="13" font-weight="400" >Local advice</text><text x="42" y="287" fill="#BCD0C0" font-family="Arial, sans-serif" font-size="13" font-weight="400" >Field notes</text><rect x="22" y="659" width="184" height="75" rx="10" fill="#2B5740" /><text x="38" y="685" fill="#D5E4B9" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">WORKS OFFLINE</text><text x="38" y="706" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="400" >Sync when connected</text><rect x="228" y="0" width="1212" height="74" rx="0" fill="#FFFFFF" /><text x="263" y="32" fill="#617267" font-family="Arial, sans-serif" font-size="12" font-weight="600" >MlimiSense  /  Farm workspace</text><text x="263" y="53" fill="#96A197" font-family="Arial, sans-serif" font-size="9" font-weight="600" letter-spacing=".8">DEMO EXPERIENCE  ·  SAMPLE FARM INFORMATION</text><rect x="1200" y="18" width="174" height="38" rx="18" fill="#EEF4EA" /><text x="1287" y="42" fill="#285D45" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">CHICHEWA  /  EN</text><text x="265" y="120" fill="#253B30" font-family="Arial, sans-serif" font-size="28" font-weight="700" >Start with what you can see.</text><text x="265" y="147" fill="#748276" font-family="Arial, sans-serif" font-size="12" font-weight="400" >A photo can begin a check — not replace an expert.</text><rect x="0" y="706" width="1440" height="54" rx="0" fill="#FFFFFF" /><text x="70" y="739" fill="#819083" font-family="Arial, sans-serif" font-size="9" font-weight="600" letter-spacing=".6">AI-ASSISTED CROP CHECKS  ·  LOCAL GUIDANCE  ·  HUMAN REVIEW</text><text x="1368" y="739" fill="#819083" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="end" letter-spacing="1">MLIMISENSE  /  02</text><rect x="265" y="177" width="508" height="478" rx="12" fill="#FFFFFF" stroke="#E3EAE1" stroke-width="1"/><text x="283" y="203" fill="#748276" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing=".7">CROP PHOTO  /  SAMPLE IMAGE</text><rect x="793" y="177" width="575" height="478" rx="12" fill="#FFFFFF" stroke="#E3EAE1" stroke-width="1"/><text x="811" y="203" fill="#748276" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing=".7">AI-ASSISTED FIELD CHECK  /  ILLUSTRATIVE</text><rect x="284" y="218" width="470" height="302" rx="12" fill="#EAF0E4" /><rect x="305" y="241" width="428" height="258" rx="10" fill="#DCE8D2" /><path d="M 365 473 Q 348 377 366 278" fill="none" stroke="#688A56" stroke-width="7" stroke-linecap="round"/><path d="M 365 375 Q 313 326 327 301 Q 361 309 365 375" fill="#91AD73"/><path d="M 365 346 Q 408 301 427 314 Q 415 348 365 346" fill="#A4BC82"/><path d="M 437 473 Q 420 377 438 278" fill="none" stroke="#688A56" stroke-width="7" stroke-linecap="round"/><path d="M 437 375 Q 385 326 399 301 Q 433 309 437 375" fill="#91AD73"/><path d="M 437 346 Q 480 301 499 314 Q 487 348 437 346" fill="#A4BC82"/><path d="M 509 473 Q 492 377 510 278" fill="none" stroke="#688A56" stroke-width="7" stroke-linecap="round"/><path d="M 509 375 Q 457 326 471 301 Q 505 309 509 375" fill="#91AD73"/><path d="M 509 346 Q 552 301 571 314 Q 559 348 509 346" fill="#A4BC82"/><path d="M 581 473 Q 564 377 582 278" fill="none" stroke="#688A56" stroke-width="7" stroke-linecap="round"/><path d="M 581 375 Q 529 326 543 301 Q 577 309 581 375" fill="#91AD73"/><path d="M 581 346 Q 624 301 643 314 Q 631 348 581 346" fill="#A4BC82"/><path d="M 653 473 Q 636 377 654 278" fill="none" stroke="#688A56" stroke-width="7" stroke-linecap="round"/><path d="M 653 375 Q 601 326 615 301 Q 649 309 653 375" fill="#91AD73"/><path d="M 653 346 Q 696 301 715 314 Q 703 348 653 346" fill="#A4BC82"/><rect x="305" y="241" width="428" height="258" rx="10" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8"/><text x="305" y="552" fill="#536A54" font-family="Arial, sans-serif" font-size="11" font-weight="400" >Crop and region entered by farmer</text><text x="305" y="575" fill="#748276" font-family="Arial, sans-serif" font-size="9" font-weight="400" >Photo-based suggestions need local context and human review.</text><rect x="305" y="598" width="166" height="35" rx="18" fill="#2C6447" /><text x="388" y="620" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Review suggestion  →</text><rect x="815" y="225" width="531" height="55" rx="9" fill="#F4F6EE" /><rect x="831" y="240" width="24" height="24" rx="8" fill="#E1EBD9" /><text x="843" y="257" fill="#285D45" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">i</text><text x="867" y="248" fill="#253B30" font-family="Arial, sans-serif" font-size="11" font-weight="600" >A starting point — not a confirmed diagnosis.</text><text x="867" y="265" fill="#748276" font-family="Arial, sans-serif" font-size="9" font-weight="400" >Check the field and ask a local agriculture expert.</text><text x="815" y="321" fill="#748276" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">POSSIBLE OBSERVATION</text><text x="815" y="357" fill="#253B30" font-family="Arial, sans-serif" font-size="23" font-weight="700" >Leaf condition to inspect</text><text x="815" y="383" fill="#748276" font-family="Arial, sans-serif" font-size="11" font-weight="400" >The image may show a change in leaf colour.</text><rect x="815" y="410" width="531" height="1" rx="0" fill="#E3EAE1" /><text x="815" y="442" fill="#748276" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">BEFORE YOU ACT</text><rect x="817" y="465" width="22" height="22" rx="11" fill="#EEF4E9" /><text x="828" y="480" fill="#285D45" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">01</text><text x="850" y="480" fill="#48584B" font-family="Arial, sans-serif" font-size="10" font-weight="400" >Compare several plants, not just one leaf.</text><rect x="817" y="508" width="22" height="22" rx="11" fill="#EEF4E9" /><text x="828" y="523" fill="#285D45" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">02</text><text x="850" y="523" fill="#48584B" font-family="Arial, sans-serif" font-size="10" font-weight="400" >Note recent rain, planting date and field location.</text><rect x="817" y="551" width="22" height="22" rx="11" fill="#EEF4E9" /><text x="828" y="566" fill="#285D45" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">03</text><text x="850" y="566" fill="#48584B" font-family="Arial, sans-serif" font-size="10" font-weight="400" >Share the photo with an extension officer for advice.</text><text x="815" y="625" fill="#758578" font-family="Arial, sans-serif" font-size="9" font-weight="600" >No pesticide or treatment recommendation is made.</text></svg>