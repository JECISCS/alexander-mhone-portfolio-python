<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img"><title>Illustrative project interface artwork</title><desc>Original vector artwork representing a project interface. This is not a product screenshot.</desc><rect x="0" y="0" width="1440" height="760" rx="0" fill="#F5F3FA" /><rect x="0" y="0" width="1440" height="82" rx="0" fill="#FFFFFF" /><text x="70" y="50" fill="#302C43" font-family="Arial, sans-serif" font-size="25" font-weight="700" >mindsafe</text><rect x="70" y="61" width="82" height="3" rx="2" fill="#8878D0" /><text x="1090" y="48" fill="#737088" font-family="Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">HOME     YOUR WELLBEING     GET SUPPORT</text><rect x="1288" y="22" width="105" height="38" rx="19" fill="#EEEAF9" /><text x="1340" y="46" fill="#6856B5" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">MY SPACE</text><text x="75" y="141" fill="#6856B5" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">MINDSAFE MALAWI  /  WELLBEING</text><text x="75" y="228" fill="#302C43" font-family="Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">Check in with yourself.</text><text x="78" y="298" fill="#77748A" font-family="Arial, sans-serif" font-size="15" font-weight="400" >Notice how today feels. Every answer is welcome here.</text><rect x="78" y="332" width="176" height="46" rx="23" fill="#6856B5" /><text x="166" y="361" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Start check-in</text><text x="78" y="417" fill="#89869B" font-family="Arial, sans-serif" font-size="11" font-weight="400" >Private by design  ·  Works at your pace</text><rect x="0" y="706" width="1440" height="54" rx="0" fill="#FFFFFF" /><text x="75" y="739" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">A SAFE SPACE TO TAKE YOUR NEXT SMALL STEP</text><text x="1362" y="739" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1">MINDSAFE  /  02</text><rect x="815" y="121" width="555" height="535" rx="30" fill="#EAE6F7" /><rect x="850" y="155" width="485" height="468" rx="20" fill="#FFFFFF" /><text x="884" y="199" fill="#8C86A5" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">WELLBEING CHECK-IN</text><text x="884" y="248" fill="#302C43" font-family="Arial, sans-serif" font-size="23" font-weight="700" >How has your week felt?</text><text x="884" y="277" fill="#89869B" font-family="Arial, sans-serif" font-size="12" font-weight="400" >Choose anything that feels close.</text><text x="885" y="335" fill="#5F5B73" font-family="Arial, sans-serif" font-size="12" font-weight="600" >Calm</text><rect x="990" y="325" width="250" height="12" rx="6" fill="#F0EDF7" /><rect x="990" y="325" width="190" height="12" rx="6" fill="#7B6AC6" /><text x="1261" y="335" fill="#79758C" font-family="Arial, sans-serif" font-size="11" font-weight="600" >76%</text><text x="885" y="396" fill="#5F5B73" font-family="Arial, sans-serif" font-size="12" font-weight="600" >Connected</text><rect x="990" y="386" width="250" height="12" rx="6" fill="#F0EDF7" /><rect x="990" y="386" width="135" height="12" rx="6" fill="#78A9A1" /><text x="1261" y="396" fill="#79758C" font-family="Arial, sans-serif" font-size="11" font-weight="600" >54%</text><text x="885" y="457" fill="#5F5B73" font-family="Arial, sans-serif" font-size="12" font-weight="600" >Rested</text><rect x="990" y="447" width="250" height="12" rx="6" fill="#F0EDF7" /><rect x="990" y="447" width="170" height="12" rx="6" fill="#D5AA6B" /><text x="1261" y="457" fill="#79758C" font-family="Arial, sans-serif" font-size="11" font-weight="600" >68%</text><text x="885" y="518" fill="#5F5B73" font-family="Arial, sans-serif" font-size="12" font-weight="600" >Hopeful</text><rect 