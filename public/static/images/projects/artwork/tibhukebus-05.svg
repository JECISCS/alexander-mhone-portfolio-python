<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img"><title>Illustrative project interface artwork</title><desc>Original vector artwork representing a project interface. This is not a product screenshot.</desc><rect x="0" y="0" width="1440" height="760" rx="0" fill="#F3F4EF" /><rect x="0" y="0" width="1440" height="78" rx="0" fill="#FFFFFF" /><text x="66" y="50" fill="#1D3932" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="1">TIBHU</text><text x="155" y="50" fill="#68A27B" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">KE BUS</text><text x="925" y="47" fill="#64736B" font-family="Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">BOOK A TRIP      MY BOOKINGS      HELP</text><rect x="1289" y="20" width="95" height="38" rx="19" fill="#E4F0E7" /><text x="1336" y="44" fill="#34724D" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">SIGN IN</text><text x="72" y="131" fill="#4E8B64" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2">TIBHUKEBUS  /  BUS BOOKING</text><text x="72" y="189" fill="#1E342C" font-family="Arial, sans-serif" font-size="39" font-weight="700" letter-spacing="-1">Your ticket, ready to go.</text><text x="74" y="222" fill="#76827B" font-family="Arial, sans-serif" font-size="13" font-weight="400" >Keep your booking details close for the journey.</text><rect x="0" y="706" width="1440" height="54" rx="0" fill="#FFFFFF" /><text x="70" y="739" fill="#87928B" font-family="Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">A SIMPLER WAY TO PLAN YOUR JOURNEY</text><text x="1368" y="739" fill="#87928B" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1">TIBHUKEBUS  /  05</text><rect x="72" y="266" width="810" height="374" rx="16" fill="#FFFFFF" stroke="#E5EAE4" stroke-width="1"/><rect x="72" y="266" width="810" height="77" rx="16" fill="#1E3931" /><text x="108" y="310" fill="#D4E8D8" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">TIBHUKEBUS  /  E-TICKET</text><rect x="108" y="366" width="365" height="219" rx="14" fill="#F5F8F4" /><text x="138" y="407" fill="#65826E" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">BOARDING PASS</text><text x="138" y="449" fill="#293E33" font-family="Arial, sans-serif" font-size="19" font-weight="700" >Lilongwe  →  Blantyre</text><text x="138" y="485" fill="#8B968F" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">DEPARTURE</text><text x="138" y="512" fill="#4B5D51" font-family="Arial, sans-serif" font-size="13" font-weight="600" >07:30  ·  Selected date</text><text x="138" y="550" fill="#68776E" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">CAPITAL EXPRESS  ·  SEAT 07</text><rect x="504" y="366" width="340" height="219" rx="14" fill="#E5EEE5" /><text x="534" y="407" fill="#819087" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">PASSENGER</text><text x="534" y="436" fill="#34483C" font-family="Arial, sans-serif" font-size="14" font-weight="700" >Your booking name</text><text x="534" y="477" fill="#819087" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">BOOKING REFERENCE</text><text x="534" y="506" fill="#34483C" font-family="Arial, sans-serif" font-size="17" font-weight="700" >TKB · 0482 · 19</text><text x="534" y="550" fill="#6E8373" font-family="Arial, sans-serif" font-size="10" font-weight="400" >Keep this ticket for boarding.</text><rect x="918" y="266" width="450" height="374" rx="16" fill="#DDEBE0" /><text x="960" y="316" fill="#65826E" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">YOUR JOURNEY</text><circle cx="1003" cy="382" r="15" fill="#4B9366