<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img"><title>Illustrative project interface artwork</title><desc>Original vector artwork representing a project interface. This is not a product screenshot.</desc><rect x="0" y="0" width="1440" height="760" rx="0" fill="#F5F3FA" /><rect x="0" y="0" width="1440" height="82" rx="0" fill="#FFFFFF" /><text x="70" y="50" fill="#302C43" font-family="Arial, sans-serif" font-size="25" font-weight="700" >mindsafe</text><rect x="70" y="61" width="82" height="3" rx="2" fill="#8878D0" /><text x="1090" y="48" fill="#737088" font-family="Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">HOME     YOUR WELLBEING     GET SUPPORT</text><rect x="1288" y="22" width="105" height="38" rx="19" fill="#EEEAF9" /><text x="1340" y="46" fill="#6856B5" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">MY SPACE</text><text x="75" y="141" fill="#6856B5" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">MINDSAFE MALAWI  /  WELLBEING</text><text x="75" y="228" fill="#302C43" font-family="Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">Take a moment</text><text x="75" y="287" fill="#302C43" font-family="Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">to reset.</text><text x="78" y="357" fill="#77748A" font-family="Arial, sans-serif" font-size="15" font-weight="400" >A quiet breathing exercise you can do at your own pace.</text><rect x="78" y="391" width="176" height="46" rx="23" fill="#6856B5" /><text x="166" y="420" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Begin breathing</text><text x="78" y="476" fill="#89869B" font-family="Arial, sans-serif" font-size="11" font-weight="400" >Private by design  ·  Works at your pace</text><rect x="0" y="706" width="1440" height="54" rx="0" fill="#FFFFFF" /><text x="75" y="739" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">A SAFE SPACE TO TAKE YOUR NEXT SMALL STEP</text><text x="1362" y="739" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1">MINDSAFE  /  05</text><rect x="815" y="121" width="555" height="535" rx="30" fill="#EAE6F7" /><rect x="850" y="155" width="485" height="468" rx="20" fill="#FFFFFF" /><text x="884" y="199" fill="#8C86A5" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">A MOMENT TO RESET</text><text x="884" y="244" fill="#302C43" font-family="Arial, sans-serif" font-size="22" font-weight="700" >Breathe in. Breathe out.</text><text x="884" y="274" fill="#89869B" font-family="Arial, sans-serif" font-size="11" font-weight="400" >Follow the circle for one slow breath.</text><rect x="1002" y="319" width="185" height="185" rx="92" fill="#F2EFFA" /><rect x="1021" y="338" width="147" height="147" rx="74" fill="#DDD6F2" /><rect x="1041" y="358" width="107" height="107" rx="54" fill="#8978CE" /><text x="1094" y="412" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">IN</text><text x="1094" y="435" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle">4</text><text x="884" y="552" fill="#6856B5" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2">INHALE</text><rect x="884" y="565" width="416" height="5" rx="3" fill="#EEEAF5" /><rect x="884" y="565" width="182" height="5" rx="3" fill="#8573C9" /><text x="884" y="598" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="400" >No rush. Stop whenever you're ready.</text></svg>