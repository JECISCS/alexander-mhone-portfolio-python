<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img"><title>Illustrative project interface artwork</title><desc>Original vector artwork representing a project interface. This is not a product screenshot.</desc><rect x="0" y="0" width="1440" height="760" rx="0" fill="#F5F3FA" /><rect x="0" y="0" width="1440" height="82" rx="0" fill="#FFFFFF" /><text x="70" y="50" fill="#302C43" font-family="Arial, sans-serif" font-size="25" font-weight="700" >mindsafe</text><rect x="70" y="61" width="82" height="3" rx="2" fill="#8878D0" /><text x="1090" y="48" fill="#737088" font-family="Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">HOME     YOUR WELLBEING     GET SUPPORT</text><rect x="1288" y="22" width="105" height="38" rx="19" fill="#EEEAF9" /><text x="1340" y="46" fill="#6856B5" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">MY SPACE</text><text x="75" y="141" fill="#6856B5" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">MINDSAFE MALAWI  /  WELLBEING</text><text x="75" y="228" fill="#302C43" font-family="Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">You don't have to</text><text x="75" y="287" fill="#302C43" font-family="Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">figure it out alone.</text><text x="78" y="357" fill="#77748A" font-family="Arial, sans-serif" font-size="15" font-weight="400" >Find a trusted person and make a plan to reach out.</text><rect x="78" y="391" width="176" height="46" rx="23" fill="#6856B5" /><text x="166" y="420" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Make a plan</text><text x="78" y="476" fill="#89869B" font-family="Arial, sans-serif" font-size="11" font-weight="400" >Private by design  ·  Works at your pace</text><rect x="0" y="706" width="1440" height="54" rx="0" fill="#FFFFFF" /><text x="75" y="739" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">A SAFE SPACE TO TAKE YOUR NEXT SMALL STEP</text><text x="1362" y="739" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1">MINDSAFE  /  04</text><rect x="815" y="121" width="555" height="535" rx="30" fill="#EAE6F7" /><rect x="850" y="155" width="485" height="468" rx="20" fill="#FFFFFF" /><text x="884" y="199" fill="#8C86A5" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">YOUR SUPPORT CIRCLE</text><text x="884" y="243" fill="#302C43" font-family="Arial, sans-serif" font-size="22" font-weight="700" >Who feels safe to talk to?</text><text x="884" y="271" fill="#89869B" font-family="Arial, sans-serif" font-size="11" font-weight="400" >Start with one person you trust.</text><rect x="884" y="304" width="416" height="62" rx="13" fill="#FBFAFD" stroke="#EFECF4" stroke-width="1"/><rect x="899" y="313" width="44" height="44" rx="15" fill="#EAE4F7" /><text x="921" y="341" fill="#6856B5" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">F</text><text x="958" y="331" fill="#3B364D" font-family="Arial, sans-serif" font-size="12" font-weight="700" >A trusted friend</text><text x="958" y="349" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="400" >Someone who listens</text><text x="1275" y="342" fill="#6856B5" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle">→</text><rect x="884" y="384" width="416" height="62" rx="13" fill="#FBFAFD" stroke="#EFECF4" stroke-width="1"/><rect x="899" y="393" width="44" height="44" rx="15" fill="#E6F0EC" /><text x="921" y="421" fill="#6856B5" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">M</text><text x="958" y="411" fill="#3B364D" font-family="Arial, sans-serif" font-size="12" font-weight="700" >Family member</text><text x="958" y="429" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="400" >Someone you feel safe with</text><text x="1275" y="422" fill="#6856B5" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle">→</text><rect x="884" y="464" width="416" height="62" rx="13" fill="#FBFAFD" stroke="#EFECF4" stroke-width="1"/><rect x="899" y="473" width="44" height="44" rx="15" fill="#F5EBDD" /><text x="921" y="501" fill="#6856B5" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">+</text><text x="958" y="491" fill="#3B364D" font-family="Arial, sans-serif" font-size="12" font-weight="700" >Support service</text><text x="958" y="509" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="400" >Confidential help is available</text><text x="1275" y="502" fill="#6856B5" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle">→</text><rect x="884" y="559" width="416" height="38" rx="19" fill="#F4F1FA" /><text x="1092" y="584" fill="#6856B5" font-family="Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">You choose what to share.</text></svg>