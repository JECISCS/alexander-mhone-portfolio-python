<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img"><title>Illustrative project interface artwork</title><desc>Original vector artwork representing a project interface. This is not a product screenshot.</desc><rect x="0" y="0" width="1440" height="760" rx="0" fill="#F5F3FA" /><rect x="0" y="0" width="1440" height="82" rx="0" fill="#FFFFFF" /><text x="70" y="50" fill="#302C43" font-family="Arial, sans-serif" font-size="25" font-weight="700" >mindsafe</text><rect x="70" y="61" width="82" height="3" rx="2" fill="#8878D0" /><text x="1090" y="48" fill="#737088" font-family="Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">HOME     YOUR WELLBEING     GET SUPPORT</text><rect x="1288" y="22" width="105" height="38" rx="19" fill="#EEEAF9" /><text x="1340" y="46" fill="#6856B5" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">MY SPACE</text><text x="75" y="141" fill="#6856B5" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">MINDSAFE MALAWI  /  WELLBEING</text><text x="75" y="228" fill="#302C43" font-family="Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">A little support,</text><text x="75" y="287" fill="#302C43" font-family="Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">right when you need it.</text><text x="78" y="357" fill="#77748A" font-family="Arial, sans-serif" font-size="15" font-weight="400" >A calmer space to check in, find guidance and take one small step.</text><rect x="78" y="391" width="176" height="46" rx="23" fill="#6856B5" /><text x="166" y="420" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Explore support</text><text x="78" y="476" fill="#89869B" font-family="Arial, sans-serif" font-size="11" font-weight="400" >Private by design  ·  Works at your pace</text><rect x="0" y="706" width="1440" height="54" rx="0" fill="#FFFFFF" /><text x="75" y="739" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">A SAFE SPACE TO TAKE YOUR NEXT SMALL STEP</text><text x="1362" y="739" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1">MINDSAFE  /  01</text><rect x="815" y="121" width="555" height="535" rx="30" fill="#EAE6F7" /><rect x="850" y="155" width="485" height="468" rx="20" fill="#FFFFFF" /><text x="884" y="199" fill="#8C86A5" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">YOUR DAILY CHECK-IN</text><text x="884" y="244" fill="#302C43" font-family="Arial, sans-serif" font-size="22" font-weight="700" >How are you feeling today?</text><text x="884" y="271" fill="#89869B" font-family="Arial, sans-serif" font-size="11" font-weight="400" >There is no right or wrong answer.</text><rect x="880" y="304" width="90" height="106" rx="16" fill="#F8F7FB" /><text x="925" y="352" fill="#E29F53" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">☀</text><text x="925" y="384" fill="#5F5B73" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Good</text><rect x="985" y="304" width="90" height="106" rx="16" fill="#F5F2FC" /><text x="1030" y="352" fill="#8170C4" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">◒</text><text x="1030" y="384" fill="#5F5B73" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Okay</text><rect x="1090" y="304" width="90" height="106" rx="16" fill="#F8F7FB" /><text x="1135" y="352" fill="#678FAA" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">☁</text><text x="1135" y="384" fill="#5F5B73" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Low</text><rect x="1195" y="304" width="90" height="106" rx="16" fill="#F8F7FB" /><text x="1240" y="352" fill="#C27B9D" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">♡</text><text x="1240" y="384" fill="#5F5B73" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Unsure</text><text x="884" y="455" fill="#6856B5" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">TODAY'S GENTLE REMINDER</text><text x="884" y="490" fill="#302C43" font-family="Arial, sans-serif" font-size="16" font-weight="600" >You deserve care, even on</text><text x="884" y="514" fill="#302C43" font-family="Arial, sans-serif" font-size="16" font-weight="600" >the days when things feel hard.</text><rect x="884" y="549" width="190" height="43" rx="21" fill="#EEEAF9" /><text x="979" y="576" fill="#6856B5" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">See support options  →</text></svg>