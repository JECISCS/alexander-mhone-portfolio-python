<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img"><title>Illustrative project interface artwork</title><desc>Original vector artwork representing a project interface. This is not a product screenshot.</desc><rect x="0" y="0" width="1440" height="760" rx="0" fill="#F2F5EF" /><rect x="0" y="0" width="228" height="760" rx="0" fill="#214B39" /><text x="31" y="47" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">MLIMI</text><text x="31" y="69" fill="#B8D7B3" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2">SENSE  /  AI</text><rect x="28" y="94" width="172" height="1" rx="0" fill="#3A654D" /><text x="42" y="143" fill="#BCD0C0" font-family="Arial, sans-serif" font-size="13" font-weight="400" >My farm</text><text x="42" y="191" fill="#BCD0C0" font-family="Arial, sans-serif" font-size="13" font-weight="400" >Check a crop</text><rect x="13" y="214" width="201" height="38" rx="8" fill="#35644A" /><rect x="13" y="214" width="3" height="38" rx="2" fill="#C2DD83" /><text x="42" y="239" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="400" >Local advice</text><text x="42" y="287" fill="#BCD0C0" font-family="Arial, sans-serif" font-size="13" font-weight="400" >Field notes</text><rect x="22" y="659" width="184" height="75" rx="10" fill="#2B5740" /><text x="38" y="685" fill="#D5E4B9" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">WORKS OFFLINE</text><text x="38" y="706" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="400" >Sync when connected</text><rect x="228" y="0" width="1212" height="74" rx="0" fill="#FFFFFF" /><text x="263" y="32" fill="#617267" font-family="Arial, sans-serif" font-size="12" font-weight="600" >MlimiSense  /  Farm workspace</text><text x="263" y="53" fill="#96A197" font-family="Arial, sans-serif" font-size="9" font-weight="600" letter-spacing=".8">DEMO EXPERIENCE  ·  SAMPLE FARM INFORMATION</text><rect x="1200" y="18" width="174" height="38" rx="18" fill="#EEF4EA" /><text x="1287" y="42" fill="#285D45" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">CHICHEWA  /  EN</text><text x="265" y="120" fill="#253B30" font-family="Arial, sans-serif" font-size="28" font-weight="700" >Advice that speaks your language.</text><text x="265" y="147" fill="#748276" font-family="Arial, sans-serif" font-size="12" font-weight="400" >Practical next steps in English and Chichewa.</text><rect x="0" y="706" width="1440" height="54" rx="0" fill="#FFFFFF" /><text x="70" y="739" fill="#819083" font-family="Arial, sans-serif" font-size="9" font-weight="600" letter-spacing=".6">AI-ASSISTED CROP CHECKS  ·  LOCAL GUIDANCE  ·  HUMAN REVIEW</text><text x="1368" y="739" fill="#819083" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="end" letter-spacing="1">MLIMISENSE  /  03</text><rect x="265" y="177" width="715" height="478" rx="12" fill="#FFFFFF" stroke="#E3EAE1" stroke-width="1"/><text x="283" y="203" fill="#748276" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing=".7">LOCAL ADVICE  /  EXAMPLE CONTENT</text><rect x="1000" y="177" width="368" height="478" rx="12" fill="#FFFFFF" stroke="#E3EAE1" stroke-width="1"/><text x="1018" y="203" fill="#748276" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing=".7">HOW GUIDANCE IS PREPARED</text><rect x="286" y="220" width="674" height="98" rx="12" fill="#E9F1E4" /><text x="309" y="250" fill="#285D45" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">FIELD SCENARIO</text><text x="309" y="279" fill="#253B30" font-family="Arial, sans-serif" font-size="17" font-weight="600" >Maize · Early growth · Rain-fed</text><text x="309" y="301" fill="#748276" font-family="Arial, sans-serif" font-size="10" font-weight="400" >Advice is tailored to the crop stage and farmer's location.</text><rect x="286" y="339" width="324" height="218" rx="12" fill="#FFFFFF" stroke="#E3EAE1" stroke-width="1"/><rect x="626" y="339" width="334" height="218" rx="12" fill="#FFFFFF" stroke="#E3EAE1" stroke-width="1"/><text x="306" y="372" fill="#285D45" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">ENGLISH</text><text x="646" y="372" fill="#285D45" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1">CHICHEWA</text><text x="306" y="411" fill="#253B30" font-family="Arial, sans-serif" font-size="17" font-weight="600" >Check the soil</text><text x="646" y="411" fill="#253B30" font-family="Arial, sans-serif" font-size="17" font-weight="600" >Yang'anani nthaka</text><text x="306" y="441" fill="#748276" font-family="Arial, sans-serif" font-size="11" font-weight="400" >Look at soil moisture in a few</text><text x="306" y="461" fill="#748276" font-family="Arial, sans-serif" font-size="11" font-weight="400" >places across the field. Keep a</text><text x="306" y="481" fill="#748276" font-family="Arial, sans-serif" font-size="11" font-weight="400" >note of what you find.</text><text x="646" y="441" fill="#748276" font-family="Arial, sans-serif" font-size="11" font-weight="400" >Onani chinyezi cha nthaka</text><text x="646" y="461" fill="#748276" font-family="Arial, sans-serif" font-size="11" font-weight="400" >m'malo osiyanasiyana m'munda.</text><text x="646" y="481" fill="#748276" font-family="Arial, sans-serif" font-size="11" font-weight="400" >Lembani zimene mwaona.</text><text x="306" y="533" fill="#879386" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing=".7">EXAMPLE GUIDANCE  ·  VERIFY LOCALLY</text><text x="646" y="533" fill="#879386" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing=".7">MALANGIZO ACHITSANZO</text><rect x="286" y="575" width="674" height="57" rx="10" fill="#F5F6F0" /><text x="306" y="600" fill="#253B30" font-family="Arial, sans-serif" font-size="11" font-weight="600" >Save advice for offline reference</text><text x="306" y="618" fill="#748276" font-family="Arial, sans-serif" font-size="9" font-weight="400" >Content should be reviewed by local agriculture specialists.</text><rect x="1021" y="227" width="326" height="1" rx="0" fill="#E3EAE1" /><text x="1021" y="251" fill="#253B30" font-family="Arial, sans-serif" font-size="11" font-weight="600" >01  Crop &amp; growth stage</text><text x="1021" y="273" fill="#748276" font-family="Arial, sans-serif" font-size="9" font-weight="400" >Start with what is being grown.</text><rect x="1021" y="310" width="326" height="1" rx="0" fill="#E3EAE1" /><text x="1021" y="334" fill="#253B30" font-family="Arial, sans-serif" font-size="11" font-weight="600" >02  Local context</text><text x="1021" y="356" fill="#748276" font-family="Arial, sans-serif" font-size="9" font-weight="400" >Consider season and district.</text><rect x="1021" y="393" width="326" height="1" rx="0" fill="#E3EAE1" /><text x="1021" y="417" fill="#253B30" font-family="Arial, sans-serif" font-size="11" font-weight="600" >03  Clear next step</text><text x="1021" y="439" fill="#748276" font-family="Arial, sans-serif" font-size="9" font-weight="400" >Offer practical checks first.</text><rect x="1021" y="476" width="326" height="1" rx="0" fill="#E3EAE1" /><text x="1021" y="500" fill="#253B30" font-family="Arial, sans-serif" font-size="11" font-weight="600" >04  Expert review</text><text x="1021" y="522" fill="#748276" font-family="Arial, sans-serif" font-size="9" font-weight="400" >Escalate when uncertain.</text><rect x="1021" y="579" width="326" height="49" rx="9" fill="#EFF4EA" /><text x="1037" y="600" fill="#285D45" font-family="Arial, sans-serif" font-size="10" font-weight="700" >English  /  Chichewa</text><text x="1037" y="617" fill="#748276" font-family="Arial, sans-serif" font-size="8" font-weight="400" >Language options for local access</text></svg>