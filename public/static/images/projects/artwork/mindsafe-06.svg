<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img"><title>Illustrative project interface artwork</title><desc>Original vector artwork representing a project interface. This is not a product screenshot.</desc><rect x="0" y="0" width="1440" height="760" rx="0" fill="#F5F3FA" /><rect x="0" y="0" width="1440" height="82" rx="0" fill="#FFFFFF" /><text x="70" y="50" fill="#302C43" font-family="Arial, sans-serif" font-size="25" font-weight="700" >mindsafe</text><rect x="70" y="61" width="82" height="3" rx="2" fill="#8878D0" /><text x="1090" y="48" fill="#737088" font-family="Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">HOME     YOUR WELLBEING     GET SUPPORT</text><rect x="1288" y="22" width="105" height="38" rx="19" fill="#EEEAF9" /><text x="1340" y="46" fill="#6856B5" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">MY SPACE</text><text x="75" y="141" fill="#6856B5" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">MINDSAFE MALAWI  /  WELLBEING</text><text x="75" y="228" fill="#302C43" font-family="Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">Support that stays</text><text x="75" y="287" fill="#302C43" font-family="Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">within reach.</text><text x="78" y="357" fill="#77748A" font-family="Arial, sans-serif" font-size="15" font-weight="400" >Save helpful guidance for whenever you need a reminder.</text><rect x="78" y="391" width="176" height="46" rx="23" fill="#6856B5" /><text x="166" y="420" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Browse guidance</text><text x="78" y="476" fill="#89869B" font-family="Arial, sans-serif" font-size="11" font-weight="400" >Private by design  ·  Works at your pace</text><rect x="0" y="706" width="1440" height="54" rx="0" fill="#FFFFFF" /><text x="75" y="739" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1">A SAFE SPACE TO TAKE YOUR NEXT SMALL STEP</text><text x="1362" y="739" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1">MINDSAFE  /  06</text><rect x="815" y="121" width="555" height="535" rx="30" fill="#EAE6F7" /><rect x="850" y="155" width="485" height="468" rx="20" fill="#FFFFFF" /><text x="884" y="199" fill="#8C86A5" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">YOUR SAVED SUPPORT</text><text x="884" y="242" fill="#302C43" font-family="Arial, sans-serif" font-size="22" font-weight="700" >A few things to keep close.</text><rect x="884" y="282" width="416" height="57" rx="12" fill="#FBFAFD" stroke="#EFECF4" stroke-width="1"/><rect x="898" y="292" width="38" height="38" rx="12" fill="#EAE4F7" /><text x="917" y="317" fill="#6856B5" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">♡</text><text x="951" y="306" fill="#3B364D" font-family="Arial, sans-serif" font-size="12" font-weight="700" >When feelings feel big</text><text x="951" y="324" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="400" >A reminder that emotions change.</text><rect x="884" y="353" width="416" height="57" rx="12" fill="#FBFAFD" stroke="#EFECF4" stroke-width="1"/><rect x="898" y="363" width="38" height="38" rx="12" fill="#E4F0EA" /><text x="917" y="388" fill="#6856B5" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">↗</text><text x="951" y="377" fill="#3B364D" font-family="Arial, sans-serif" font-size="12" font-weight="700" >Reach out to someone</text><text x="951" y="395" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="400" >You can ask for company or a chat.</text><rect x="884" y="424" width="416" height="57" rx="12" fill="#FBFAFD" stroke="#EFECF4" stroke-width="1"/><rect x="898" y="434" width="38" height="38" rx="12" fill="#F5EBDD" /><text x="917" y="459" fill="#6856B5" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">＋</text><text x="951" y="448" fill="#3B364D" font-family="Arial, sans-serif" font-size="12" font-weight="700" >Take care of the basics</text><text x="951" y="466" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="400" >Water, rest and a little fresh air.</text><rect x="884" y="495" width="416" height="57" rx="12" fill="#FBFAFD" stroke="#EFECF4" stroke-width="1"/><rect x="898" y="505" width="38" height="38" rx="12" fill="#F4E4E9" /><text x="917" y="530" fill="#6856B5" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">!</text><text x="951" y="519" fill="#3B364D" font-family="Arial, sans-serif" font-size="12" font-weight="700" >Find urgent support</text><text x="951" y="537" fill="#89869B" font-family="Arial, sans-serif" font-size="10" font-weight="400" >Contact local emergency services.</text></svg>